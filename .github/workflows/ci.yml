name: CI

# Roda a cada push na main e em pull requests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — validação
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        working-directory: ./backend
        run: npm ci

      - name: Verificar sintaxe dos arquivos
        working-directory: ./backend
        run: |
          for file in $(find src -name "*.js"); do
            node --check "$file" || exit 1
          done
          echo "Sintaxe validada com sucesso."

      - name: Lint
        working-directory: ./backend
        run: npm run lint

  frontend:
    name: Frontend — lint e build
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Compilar o projeto
        working-directory: ./frontend
        run: npm run build
