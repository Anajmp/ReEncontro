<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ReEncontro" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReEncontro</title>
    <meta
      name="description"
      content="ReEncontro: achados e perdidos do SESI Nova Odessa. Veja os itens encontrados na escola e reivindique o que é seu."
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <script>
      // Aplica o tema antes do React carregar, para a página não piscar em branco
      // no modo escuro (mesma chave que o next-themes usa em src/lib/tema.ts).
      // Sem escolha salva, é sempre o claro — o tema do sistema não conta.
      (function () {
        try {
          var escuro = localStorage.getItem('reencontro-tema') === 'dark';
          document.documentElement.classList.toggle('dark', escuro);
          document.documentElement.style.colorScheme = escuro ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      #root {
        height: 100%;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
